name: Pet traffic Lighthouse audits

on:
  schedule:
    # Retry the weekly audit at staggered times if GitHub delays or drops an earlier schedule event.
    # The gate below allows only one successful scheduled audit per Vilnius calendar day.
    - cron: "27 7,9,11,13 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/lighthouse-audit.yml"
      - "agent/summarize_lighthouse.py"
      - "agent/lighthouse_history.py"
      - "agent/test_lighthouse_history.py"

permissions:
  contents: write

concurrency:
  group: pettraffic-lighthouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Allow one successful scheduled Lighthouse audit per Vilnius day
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run_suite: \${{ steps.gate.outputs.run_suite }}
    steps:
      - name: Skip later retries after a successful scheduled audit
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "schedule") {
              core.setOutput("run_suite", "true");
              core.info("Manual and push-triggered audits are unchanged.");
              return;
            }

            const { owner, repo } = context.repo;
            const current = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId
            });
            const vilniusDay = value => {
              const parts = new Intl.DateTimeFormat("en-GB", {
                timeZone: "Europe/Vilnius",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }).formatToParts(new Date(value));
              const fields = Object.fromEntries(parts.map(part => [part.type, part.value]));
              return fields.year + "-" + fields.month + "-" + fields.day;
            };
            const day = vilniusDay(current.data.created_at);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "lighthouse-audit.yml", event: "schedule", per_page: 100
            });
            const alreadySucceeded = data.workflow_runs.some(run =>
              run.id !== context.runId &&
              run.status === "completed" &&
              run.conclusion === "success" &&
              vilniusDay(run.created_at) === day
            );

            core.setOutput("run_suite", alreadySucceeded ? "false" : "true");
            core.info(alreadySucceeded
              ? "A scheduled Lighthouse audit already succeeded on " + day + "; skipping this retry."
              : "No successful scheduled Lighthouse audit exists on " + day + "; run the full audit.");

  lighthouse:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_suite == 'true'
    name: Mobile and desktop Lighthouse reports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Wait for production deployment after a site change
        if: github.event_name == 'push'
        run: sleep 90
      - name: Run Lighthouse against homepage and key articles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          declare -a pages=(
            "home|https://pettraffic-ai.pages.dev/"
            "cat-emergency|https://pettraffic-ai.pages.dev/articles/kate-negali-pasislapinti-skubi-pagalba.html"
            "cat-diarrhea|https://pettraffic-ai.pages.dev/articles/kate-viduriuoja-ka-daryti.html"
            "dog-diarrhea|https://pettraffic-ai.pages.dev/articles/suo-viduriuoja-ka-daryti.html"
            "vet-visit|https://pettraffic-ai.pages.dev/articles/kada-kreiptis-i-veterinara.html"
          )
          for entry in "${pages[@]}"; do
            slug="${entry%%|*}"
            url="${entry#*|}"
            for device in mobile desktop; do
              echo "Auditing $slug ($device): $url"
              if [ "$device" = "desktop" ]; then
                npx --yes lighthouse@12.8.2 "$url" --preset=desktop --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path="./reports/$slug-$device" --quiet
              else
                npx --yes lighthouse@12.8.2 "$url" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path="./reports/$slug-$device" --quiet
              fi
            done
          done
      - name: Summarize scores
        if: always()
        run: python agent/summarize_lighthouse.py
      - name: Load existing aggregate history
        if: success()
        run: |
          git fetch origin automation-history
          git archive FETCH_HEAD reports/history | tar -x -C .
      - name: Persist privacy-safe Lighthouse history
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python agent/lighthouse_history.py
      - name: Publish aggregate Lighthouse history
        if: success()
        run: |
          mkdir -p /tmp/pettraffic-lighthouse-history
          cp -R reports/history/lighthouse /tmp/pettraffic-lighthouse-history/
          rm -rf reports/history
          git fetch origin automation-history
          git checkout -B automation-history FETCH_HEAD
          git ls-files -z | python -c 'import sys; nul=bytes([0]); paths=sys.stdin.buffer.read().split(nul); [sys.stdout.buffer.write(p+nul) for p in paths if p and not p.startswith(b"reports/history/")]' | xargs -0 -r git rm -f --
          mkdir -p reports/history
          cp -R /tmp/pettraffic-lighthouse-history/lighthouse reports/history/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/history/lighthouse
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive aggregate Lighthouse history"
            for attempt in 1 2 3 4 5; do
              if git push origin automation-history; then
                echo "Automation history archived successfully (attempt $attempt/5)."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Could not push automation-history after 5 attempts."
                exit 1
              fi
              echo "automation-history changed concurrently; rebasing before retry $((attempt + 1))/5."
              git pull --rebase origin automation-history
              sleep "$attempt"
            done
          else
            echo "No new Lighthouse snapshot to archive."
          fi
      - name: Upload full HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: |
            reports/*.report.html
            reports/*.report.json
            reports/lighthouse-summary.md
          if-no-files-found: warn
          retention-days: 30
