name: Pet traffic Lighthouse audits

on:
  schedule:
    - cron: "27 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/lighthouse-audit.yml"
      - "agent/summarize_lighthouse.py"

permissions:
  contents: read

concurrency:
  group: pettraffic-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Mobile and desktop Lighthouse reports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Wait for production deployment after a site change
        if: github.event_name == 'push'
        run: sleep 90
      - name: Run Lighthouse against homepage and key articles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          declare -a pages=(
            "home|https://pettraffic-ai.pages.dev/"
            "cat-emergency|https://pettraffic-ai.pages.dev/articles/kate-negali-pasislapinti-skubi-pagalba.html"
            "cat-diarrhea|https://pettraffic-ai.pages.dev/articles/kate-viduriuoja-ka-daryti.html"
            "dog-diarrhea|https://pettraffic-ai.pages.dev/articles/suo-viduriuoja-ka-daryti.html"
            "vet-visit|https://pettraffic-ai.pages.dev/articles/kada-kreiptis-i-veterinara.html"
          )
          for entry in "${pages[@]}"; do
            slug="${entry%%|*}"
            url="${entry#*|}"
            for device in mobile desktop; do
              echo "Auditing $slug ($device): $url"
              if [ "$device" = "desktop" ]; then
                npx --yes lighthouse@12.8.2 "$url" --preset=desktop --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path="./reports/$slug-$device" --quiet
              else
                npx --yes lighthouse@12.8.2 "$url" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path="./reports/$slug-$device" --quiet
              fi
            done
          done
      - name: Summarize scores
        if: always()
        run: python agent/summarize_lighthouse.py
      - name: Upload full HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
