name: Pet traffic Lighthouse audits

on:
  schedule:
    - cron: "27 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/lighthouse-audit.yml"
      - "agent/summarize_lighthouse.py"
      - "agent/lighthouse_history.py"
      - "agent/test_lighthouse_history.py"

permissions:
  contents: write

concurrency:
  group: pettraffic-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Mobile and desktop Lighthouse reports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Wait for production deployment after a site change
        if: github.event_name == 'push'
        run: sleep 90
      - name: Run Lighthouse against homepage and key articles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          declare -a pages=(
            "home|https://pettraffic-ai.pages.dev/"
            "cat-emergency|https://pettraffic-ai.pages.dev/articles/kate-negali-pasislapinti-skubi-pagalba.html"
            "cat-diarrhea|https://pettraffic-ai.pages.dev/articles/kate-viduriuoja-ka-daryti.html"
            "dog-diarrhea|https://pettraffic-ai.pages.dev/articles/suo-viduriuoja-ka-daryti.html"
            "vet-visit|https://pettraffic-ai.pages.dev/articles/kada-kreiptis-i-veterinara.html"
          )
          for entry in "${pages[@]}"; do
            slug="${entry%%|*}"
            url="${entry#*|}"
            for device in mobile desktop; do
              echo "Auditing $slug ($device): $url"
              if [ "$device" = "desktop" ]; then
                npx --yes lighthouse@12.8.2 "$url" --preset=desktop --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path="./reports/$slug-$device" --quiet
              else
                npx --yes lighthouse@12.8.2 "$url" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path="./reports/$slug-$device" --quiet
              fi
            done
          done
      - name: Summarize scores
        if: always()
        run: python agent/summarize_lighthouse.py
      - name: Load existing aggregate history
        if: success()
        run: |
          git fetch origin automation-history
          git archive origin/automation-history reports/history | tar -x -C .
      - name: Persist privacy-safe Lighthouse history
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python agent/lighthouse_history.py
      - name: Publish aggregate Lighthouse history
        if: success()
        run: |
          mkdir -p /tmp/pettraffic-lighthouse-history
          cp -R reports/history/lighthouse /tmp/pettraffic-lighthouse-history/
          rm -rf reports/history
          git fetch origin automation-history
          git checkout -B automation-history origin/automation-history
          git ls-files -z | python -c 'import sys; nul=bytes([0]); paths=sys.stdin.buffer.read().split(nul); [sys.stdout.buffer.write(p+nul) for p in paths if p and not p.startswith(b"reports/history/")]' | xargs -0 -r git rm -f --
          mkdir -p reports/history
          cp -R /tmp/pettraffic-lighthouse-history/lighthouse reports/history/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/history/lighthouse
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive aggregate Lighthouse history"
            for attempt in 1 2 3 4 5; do
              if git push origin automation-history; then
                echo "Automation history archived successfully (attempt $attempt/5)."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Could not push automation-history after 5 attempts."
                exit 1
              fi
              echo "automation-history changed concurrently; rebasing before retry $((attempt + 1))/5."
              git pull --rebase origin automation-history
              sleep "$attempt"
            done
          else
            echo "No new Lighthouse snapshot to archive."
          fi
      - name: Upload full HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: |
            reports/*.report.html
            reports/*.report.json
            reports/lighthouse-summary.md
          if-no-files-found: warn
          retention-days: 30
