name: Sync PetTraffic snapshots to central API
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Sync {0} snapshot #{1}', inputs.source_kind == 'control_center' && 'control-center' || 'daily-suite', inputs.source_run_id) || 'Sync PetTraffic snapshots to central API' }}"

on:
  workflow_run:
    workflows:
      - "Pet traffic analytics snapshot"
      - "Pet traffic daily topic radar"
      - "Pet traffic daily automation suite"
      - "Pet traffic central control center"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed source workflow run ID to sync"
        required: true
        type: string
      source_kind:
        description: "Source snapshot type"
        required: true
        type: choice
        options:
          - daily_suite
          - control_center
        default: daily_suite
      owner_bridge_run_id:
        description: "Verified owner-bridge run ID (control_center fallback only)"
        required: false
        type: string
      owner_bridge_comment_id:
        description: "Verified owner issue-comment ID (control_center fallback only)"
        required: false
        type: string
      daily_suite_run_id:
        description: "Verified daily-suite run ID (control_center fallback only)"
        required: false
        type: string
      daily_suite_sync_run_id:
        description: "Successful daily-suite D1 sync run ID (control_center fallback only)"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "worker/scripts/**"
      - "worker/test/**"
      - ".github/workflows/sync-control-api.yml"

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Test event payload builder
        run: python -m unittest discover -s worker/test -p '*_test.py' -v

  sync:
    permissions:
      actions: read
      contents: read
      issues: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.workflow_id == 418322987))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check whether central API is configured
        id: config
        env:
          API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
        run: |
          if [ -n "$API_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Central API URL is missing; GitHub history remains the source of truth."
          fi
      - name: Validate source run and owner-bridge provenance
        id: suite-source
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.workflow_id == 418322987
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          SOURCE_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.source_kind || 'daily_suite' }}
          OWNER_BRIDGE_RUN_ID: ${{ inputs.owner_bridge_run_id }}
          OWNER_BRIDGE_COMMENT_ID: ${{ inputs.owner_bridge_comment_id }}
          DAILY_SUITE_RUN_ID: ${{ inputs.daily_suite_run_id }}
          DAILY_SUITE_SYNC_RUN_ID: ${{ inputs.daily_suite_sync_run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = Number(process.env.SOURCE_RUN_ID);
            const sourceKind = process.env.SOURCE_KIND || "daily_suite";
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed("A valid source workflow run ID is required.");
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const timestamp = value => Date.parse(value || "");
            const day = value => {
              const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Vilnius", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date(value));
              const fields = Object.fromEntries(parts.map(part => [part.type, part.value]));
              return fields.year + "-" + fields.month + "-" + fields.day;
            };

            // The bridge waits for these child syncs, so it is still in progress
            // when they validate it. Exact owner comment and timestamp checks below
            // bind the active parent to this source run; the bridge must finish successfully.
            const isVerifiedOwnerBridge = bridge =>
              bridge.workflow_id === 418997808 &&
              bridge.event === "issue_comment" &&
              bridge.head_branch === "main" &&
              ((bridge.status === "in_progress" && bridge.conclusion == null) ||
                (bridge.status === "completed" && bridge.conclusion === "success")) &&
              bridge.actor?.login === "Pershore";

            let sourceEvent = "schedule";
            let ownerBridgeRunId = "";
            let ownerBridgeCommentId = "";
            let ownerActor = "";

            if (sourceKind === "control_center") {
              if (run.workflow_id !== 416336983 || run.head_branch !== "main" ||
                  run.event !== "workflow_dispatch" || run.status !== "completed" ||
                  run.conclusion !== "success") {
                core.setFailed("Control Center source must be a successful main-branch workflow_dispatch run.");
                return;
              }
              ownerBridgeRunId = String(process.env.OWNER_BRIDGE_RUN_ID || "");
              ownerBridgeCommentId = String(process.env.OWNER_BRIDGE_COMMENT_ID || "");
              const dailyRunId = Number(process.env.DAILY_SUITE_RUN_ID);
              const dailySyncRunId = Number(process.env.DAILY_SUITE_SYNC_RUN_ID);
              if (![ownerBridgeRunId, ownerBridgeCommentId].every(value => /^\d+$/.test(value)) ||
                  !Number.isSafeInteger(dailyRunId) || dailyRunId <= 0 ||
                  !Number.isSafeInteger(dailySyncRunId) || dailySyncRunId <= 0) {
                core.setFailed("Control Center fallback provenance identifiers are incomplete.");
                return;
              }
              const [bridgeResponse, commentResponse, dailyResponse, dailySyncResponse] = await Promise.all([
                github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(ownerBridgeRunId) }),
                github.rest.issues.getComment({ owner, repo, comment_id: Number(ownerBridgeCommentId) }),
                github.rest.actions.getWorkflowRun({ owner, repo, run_id: dailyRunId }),
                github.rest.actions.getWorkflowRun({ owner, repo, run_id: dailySyncRunId })
              ]);
              const bridge = bridgeResponse.data;
              const comment = commentResponse.data;
              const daily = dailyResponse.data;
              const dailySync = dailySyncResponse.data;
              const issueNumber = Number(String(comment.issue_url || "").match(/\/issues\/(\d+)$/)?.[1] || 0);
              const marker = "Owner-approved fallback | bridge=" + ownerBridgeRunId + " | comment=" + ownerBridgeCommentId;
              const validBridge = isVerifiedOwnerBridge(bridge);
              const validComment = issueNumber === 145 &&
                String(comment.body || "").trim() === "/pettraffic-run-daily-suite" &&
                comment.user?.login === "Pershore";
              const validDaily = daily.workflow_id === 418322987 && daily.head_branch === "main" &&
                daily.event === "workflow_dispatch" && daily.status === "completed" &&
                daily.conclusion === "success" && daily.display_title === marker &&
                ["Pershore", "github-actions[bot]"].includes(daily.actor?.login);
              const validDailySync = dailySync.workflow_id === 416372705 &&
                dailySync.head_branch === "main" && dailySync.event === "workflow_dispatch" &&
                dailySync.status === "completed" && dailySync.conclusion === "success" &&
                dailySync.display_title === "Sync daily-suite snapshot #" + dailyRunId;
              const ordered = timestamp(comment.created_at) <= timestamp(bridge.created_at) &&
                timestamp(bridge.created_at) <= timestamp(daily.created_at) &&
                timestamp(daily.created_at) <= timestamp(dailySync.created_at) &&
                timestamp(dailySync.created_at) <= timestamp(run.created_at);
              const sameDay = [comment.created_at, bridge.created_at, daily.created_at,
                dailySync.created_at, run.created_at].every(value => day(value) === day(run.created_at));
              if (!validBridge || !validComment || !validDaily || !validDailySync || !ordered || !sameDay) {
                core.setFailed("Control Center fallback failed owner comment, bridge, daily-suite, sync, or same-day sequence verification.");
                return;
              }
              sourceEvent = "owner_bridge_fallback";
              ownerActor = "Pershore";
            } else if (sourceKind === "daily_suite") {
              if (run.workflow_id !== 418322987 || run.head_branch !== "main" ||
                  !["schedule", "workflow_dispatch"].includes(run.event) ||
                  run.status !== "completed") {
                core.setFailed("Source run is not a completed main-branch daily-suite schedule/dispatch run.");
                return;
              }
              if (run.event === "workflow_dispatch") {
                const marker = /^Owner-approved fallback \| bridge=(\d+) \| comment=(\d+)$/.exec(String(run.display_title || ""));
                if (!marker || !["Pershore", "github-actions[bot]"].includes(run.actor?.login)) {
                  core.setFailed("Manual daily-suite run has no owner-bridge authorization marker.");
                  return;
                }
                ownerBridgeRunId = marker[1];
                ownerBridgeCommentId = marker[2];
                const [bridgeResponse, commentResponse] = await Promise.all([
                  github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(ownerBridgeRunId) }),
                  github.rest.issues.getComment({ owner, repo, comment_id: Number(ownerBridgeCommentId) })
                ]);
                const bridge = bridgeResponse.data;
                const comment = commentResponse.data;
                const issueNumber = Number(String(comment.issue_url || "").match(/\/issues\/(\d+)$/)?.[1] || 0);
                const commentAt = timestamp(comment.created_at), bridgeAt = timestamp(bridge.created_at), sourceAt = timestamp(run.created_at);
                const validBridge = isVerifiedOwnerBridge(bridge);
                const validComment = issueNumber === 145 &&
                  String(comment.body || "").trim() === "/pettraffic-run-daily-suite" && comment.user?.login === "Pershore";
                const validSequence = Number.isFinite(commentAt) && Number.isFinite(bridgeAt) && Number.isFinite(sourceAt) &&
                  bridgeAt >= commentAt && bridgeAt - commentAt <= 10 * 60 * 1000 &&
                  sourceAt >= bridgeAt && sourceAt - bridgeAt <= 10 * 60 * 1000 &&
                  day(comment.created_at) === day(bridge.created_at) && day(bridge.created_at) === day(run.created_at);
                if (!validBridge || !validComment || !validSequence) {
                  core.setFailed("Owner-bridge fallback failed exact issue-comment, workflow identity, actor, or same-day timing verification.");
                  return;
                }
                sourceEvent = "owner_bridge_fallback";
                ownerActor = "Pershore";
              }
            } else {
              core.setFailed("Unsupported source_kind; expected daily_suite or control_center.");
              return;
            }

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: runId, per_page: 100
            });
            if (sourceKind === "daily_suite") {
              const hasData = jobs.jobs.some(job =>
                ["analytics", "topic-radar"].includes(job.name) && job.conclusion === "success"
              );
              if (!hasData) {
                core.setFailed("Source daily-suite run has no successful analytics or topic-radar artifact job.");
                return;
              }
            } else if (!jobs.jobs.some(job => job.name === "Read-only automation health and priorities" && job.conclusion === "success")) {
              core.setFailed("Control Center run has no successful report-generation job.");
              return;
            }
            core.setOutput("eligible", "true");
            core.setOutput("source_kind", sourceKind);
            core.setOutput("source_run_id", String(run.id));
            core.setOutput("source_event", sourceEvent);
            core.setOutput("source_trigger_event", String(run.event));
            core.setOutput("source_run_created_at", String(run.created_at));
            core.setOutput("source_workflow_id", String(run.workflow_id));
            core.setOutput("owner_approved_fallback", sourceEvent === "owner_bridge_fallback" ? "true" : "false");
            core.setOutput("owner_actor", ownerActor);
            core.setOutput("owner_bridge_run_id", ownerBridgeRunId);
            core.setOutput("owner_bridge_comment_id", ownerBridgeCommentId);
            core.info("Validated " + sourceKind + " source run #" + run.id + " (" + sourceEvent + ").");
      - name: Download source workflow artifact
        if: steps.config.outputs.enabled == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id != 418322987
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.workflow_run.name == 'Pet traffic analytics snapshot' && 'pettraffic-analytics-7d' || github.event.workflow_run.name == 'Pet traffic daily topic radar' && 'pettraffic-topic-radar' || 'pettraffic-control-center' }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Download manually dispatched Control Center artifact
        if: steps.config.outputs.enabled == 'true' && steps.suite-source.outputs.eligible == 'true' && steps.suite-source.outputs.source_kind == 'control_center'
        uses: actions/download-artifact@v8
        with:
          name: pettraffic-control-center
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.suite-source.outputs.source_run_id }}
      - name: Download daily suite analytics artifact
        if: steps.config.outputs.enabled == 'true' && steps.suite-source.outputs.eligible == 'true' && steps.suite-source.outputs.source_kind == 'daily_suite'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pettraffic-analytics-7d
          path: artifacts/analytics
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.suite-source.outputs.source_run_id }}
      - name: Download daily suite topic artifact
        if: steps.config.outputs.enabled == 'true' && steps.suite-source.outputs.eligible == 'true' && steps.suite-source.outputs.source_kind == 'daily_suite'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pettraffic-topic-radar
          path: artifacts/topic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.suite-source.outputs.source_run_id }}
      - name: Prepare privacy-filtered event payloads
        if: steps.config.outputs.enabled == 'true' && ((github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id != 418322987) || steps.suite-source.outputs.eligible == 'true')
        env:
          WORKFLOW_NAME: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_kind == 'control_center' && 'Pet traffic central control center' || 'Pet traffic daily automation suite') || github.event.workflow_run.workflow_id == 418322987 && 'Pet traffic daily automation suite' || github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ steps.suite-source.outputs.source_run_id || github.event.workflow_run.id }}
          SOURCE_EVENT: ${{ steps.suite-source.outputs.source_event || github.event.workflow_run.event }}
          SOURCE_TRIGGER_EVENT: ${{ steps.suite-source.outputs.source_trigger_event || github.event.workflow_run.event }}
          SOURCE_RUN_CREATED_AT: ${{ steps.suite-source.outputs.source_run_created_at || github.event.workflow_run.created_at }}
          SOURCE_WORKFLOW_ID: ${{ steps.suite-source.outputs.source_workflow_id || github.event.workflow_run.workflow_id }}
          OWNER_APPROVED_FALLBACK: ${{ steps.suite-source.outputs.owner_approved_fallback || 'false' }}
          OWNER_ACTOR: ${{ steps.suite-source.outputs.owner_actor || '' }}
          OWNER_BRIDGE_RUN_ID: ${{ steps.suite-source.outputs.owner_bridge_run_id || '' }}
          OWNER_BRIDGE_COMMENT_ID: ${{ steps.suite-source.outputs.owner_bridge_comment_id || '' }}
        run: |
          python worker/scripts/build_event.py \
            --workflow-name "$WORKFLOW_NAME" \
            --artifact-dir artifacts \
            --output-dir events \
            --run-id "$SOURCE_RUN_ID" \
            --source-event "$SOURCE_EVENT" \
            --source-run-created-at "$SOURCE_RUN_CREATED_AT" \
            --source-workflow-id "$SOURCE_WORKFLOW_ID" \
            --source-trigger-event "$SOURCE_TRIGGER_EVENT" \
            --owner-approved-fallback "$OWNER_APPROVED_FALLBACK" \
            --owner-actor "$OWNER_ACTOR" \
            --owner-bridge-run-id "$OWNER_BRIDGE_RUN_ID" \
            --owner-bridge-comment-id "$OWNER_BRIDGE_COMMENT_ID"
      - name: Authenticate with short-lived GitHub OIDC and publish snapshots
        if: steps.config.outputs.enabled == 'true' && ((github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id != 418322987) || steps.suite-source.outputs.eligible == 'true')
        env:
          API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          oidc_response="$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=pettraffic-control-api" \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          API_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")"
          unset oidc_response
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $API_TOKEN" "$API_URL/v1/events")"
          if [ "$status" != "200" ]; then
            echo "GitHub OIDC authentication was rejected by the control API (HTTP $status)."
            exit 1
          fi
          for file in events/*.json; do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST "$API_URL/v1/events" \
              --header "Authorization: Bearer $API_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$file")"
            event_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$response")"
            kind="$(python -c 'import json,sys; print(json.load(sys.stdin)["kind"])' < "$file")"
            readback_file="$(mktemp)"
            curl --fail-with-body --silent --show-error --get "$API_URL/v1/events" \
              --data-urlencode "kind=$kind" \
              --header "Authorization: Bearer $API_TOKEN" \
              --output "$readback_file"
            python - "$readback_file" "$event_id" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          expected_id = sys.argv[2]
          if not any(str(item.get("id")) == expected_id for item in payload.get("events", [])):
              raise SystemExit("Snapshot was accepted but could not be read back from D1.")
          print("OK: D1 snapshot write/read verified.")
          PY
            rm -f "$readback_file"
            unset response event_id kind readback_file
          done
          unset API_TOKEN
          echo "Privacy-filtered snapshots published and read back using short-lived GitHub OIDC identity."
