name: Sync PetTraffic snapshots to central API

on:
  workflow_run:
    workflows:
      - "Pet traffic analytics snapshot"
      - "Pet traffic daily topic radar"
      - "Pet traffic central control center"
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "worker/scripts/**"
      - "worker/test/**"
      - ".github/workflows/sync-control-api.yml"

permissions:
  actions: read
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test event payload builder
        run: python -m unittest discover -s worker/test -p '*_test.py' -v

  sync:
    permissions:
      actions: read
      contents: read
      id-token: write
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check whether central API is configured
        id: config
        env:
          API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
        run: |
          if [ -n "$API_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Central API URL is missing; GitHub history remains the source of truth."
          fi
      - name: Download source workflow artifact
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.workflow_run.name == 'Pet traffic analytics snapshot' && 'pettraffic-analytics-7d' || github.event.workflow_run.name == 'Pet traffic daily topic radar' && 'pettraffic-topic-radar' || 'pettraffic-control-center' }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare privacy-filtered event payloads
        if: steps.config.outputs.enabled == 'true'
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python worker/scripts/build_event.py \
            --workflow-name "$WORKFLOW_NAME" \
            --artifact-dir artifacts \
            --output-dir events \
            --run-id "$SOURCE_RUN_ID"
      - name: Authenticate with short-lived GitHub OIDC and publish snapshots
        if: steps.config.outputs.enabled == 'true'
        env:
          API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          oidc_response="$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=pettraffic-control-api" \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          API_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")"
          unset oidc_response
          # Print only non-secret identity claims to diagnose strict Worker authorization.
          python - "$API_TOKEN" <<'PY'
          import base64, json, sys
          token = sys.argv[1]
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("OIDC token has an invalid JWT structure.")
          payload = parts[1]
          payload += "=" * ((4 - len(payload) % 4) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "pettraffic-control-api",
              "sub": "repo:Pershore/PetTraffic-AI:ref:refs/heads/main",
              "repository": "Pershore/PetTraffic-AI",
              "ref": "refs/heads/main",
              "workflow_ref": "Pershore/PetTraffic-AI/.github/workflows/sync-control-api.yml@refs/heads/main",
              "event_name": "workflow_run",
          }
          for key, wanted in expected.items():
              actual = claims.get(key)
              print(f"OIDC claim {key}: {actual!r}; expected {wanted!r}; match={actual == wanted}")
          print("OIDC token time claims: exp=", claims.get("exp"), "nbf=", claims.get("nbf"))
          PY
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $API_TOKEN" "$API_URL/v1/events")"
          if [ "$status" != "200" ]; then
            echo "GitHub OIDC authentication was rejected by the control API (HTTP $status)."
            exit 1
          fi
          for file in events/*.json; do
            curl --fail-with-body --silent --show-error \
              --request POST "$API_URL/v1/events" \
              --header "Authorization: Bearer $API_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$file"
          done
          unset API_TOKEN
          echo "Privacy-filtered snapshots published using short-lived GitHub OIDC identity."
