name: Sync PetTraffic snapshots to central API

on:
  workflow_run:
    workflows:
      - "Pet traffic analytics snapshot"
      - "Pet traffic daily topic radar"
      - "Pet traffic central control center"
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "worker/scripts/**"
      - "worker/test/**"
      - ".github/workflows/sync-control-api.yml"

permissions:
  actions: read
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test event payload builder
        run: python -m unittest discover -s worker/test -p '*_test.py' -v

  sync:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check whether central API is configured
        id: config
        env:
          API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
          API_TOKEN: ${{ secrets.PETTRAFFIC_CONTROL_API_TOKEN }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Central API not configured; GitHub history remains the source of truth."
          fi
      - name: Set up Node.js for Worker secret management
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure the Worker accepts the configured API token
        if: steps.config.outputs.enabled == 'true'
        env:
          API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
          API_TOKEN: ${{ secrets.PETTRAFFIC_CONTROL_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $API_TOKEN" "$API_URL/v1/events")"
          if [ "$status" = "200" ]; then
            echo "Worker API authentication is already configured."
            exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable" && exit 1)
          cat > worker/.wrangler-secret.toml <<EOF
          name = "pettraffic-control-api"
          main = "src/index.mjs"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          compatibility_date = "2026-11-12"
          EOF
          printf '%s' "$API_TOKEN" | npx --yes wrangler@4 secret put API_TOKEN --config worker/.wrangler-secret.toml
          rm -f worker/.wrangler-secret.toml
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $API_TOKEN" "$API_URL/v1/events"
          echo "Worker API authentication configured and verified."
      - name: Download source workflow artifact
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.workflow_run.name == 'Pet traffic analytics snapshot' && 'pettraffic-analytics-7d' || github.event.workflow_run.name == 'Pet traffic daily topic radar' && 'pettraffic-topic-radar' || 'pettraffic-control-center' }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare privacy-filtered event payloads
        if: steps.config.outputs.enabled == 'true'
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python worker/scripts/build_event.py \
            --workflow-name "$WORKFLOW_NAME" \
            --artifact-dir artifacts \
            --output-dir events \
            --run-id "$SOURCE_RUN_ID"
      - name: Publish snapshots to central API
        if: steps.config.outputs.enabled == 'true'
        env:
          API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
          API_TOKEN: ${{ secrets.PETTRAFFIC_CONTROL_API_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          for file in events/*.json; do
            curl --fail-with-body --silent --show-error \
              --request POST "$API_URL/v1/events" \
              --header "Authorization: Bearer $API_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$file"
          done
