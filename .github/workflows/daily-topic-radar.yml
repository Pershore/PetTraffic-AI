name: Pet traffic daily topic radar

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topic-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect Lithuanian pet-topic headlines
        run: python agent/topic_radar.py
      - name: Upload daily topic report
        uses: actions/upload-artifact@v4
        with:
          name: pettraffic-topic-radar
          path: reports/topic-radar.md
          if-no-files-found: error
          retention-days: 30
