name: Pet traffic read-only task runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pettraffic-readonly-task-runner
  cancel-in-progress: false

jobs:
  run-one-task:
    # This workflow is dispatched only after the owner-only bridge queues an allow-listed task.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PETTRAFFIC_CONTROL_API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
    steps:
      - name: Check out trusted main-branch code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Claim and execute one bounded read-only task
        run: python agent/run_task_worker.py
