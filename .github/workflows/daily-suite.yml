name: Pet traffic daily automation suite
run-name: "${{ inputs.fallback_mode == 'owner_bridge' && format('Owner-approved fallback | bridge={0} | comment={1}', inputs.bridge_run_id, inputs.bridge_comment_id) || (github.event_name == 'schedule' && 'Scheduled daily automation suite' || 'Manually triggered daily automation suite') }}"

on:
  schedule:
    # Retry the daily data collection at staggered times if GitHub delays or drops an earlier schedule event.
    # The gate below allows only one successful full suite per Vilnius calendar day.
    - cron: "10 6,8,10,11 * * *"
  workflow_dispatch:
    inputs:
      fallback_mode:
        description: "Fallback authorization source; owner_bridge is accepted only with a verified owner issue command."
        required: false
        type: choice
        options:
          - manual
          - owner_bridge
        default: manual
      bridge_run_id:
        description: "Owner-command bridge workflow run ID (set only by the secure issue-comment bridge)."
        required: false
        type: string
        default: ""
      bridge_comment_id:
        description: "Owner issue-comment ID authorizing this fallback."
        required: false
        type: string
        default: ""

concurrency:
  group: pettraffic-daily-suite
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Allow one successful scheduled suite per Vilnius day
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run_suite: ${{ steps.gate.outputs.run_suite }}
    steps:
      - name: Skip later retries after a successful scheduled run
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "schedule") {
              core.setOutput("run_suite", "true");
              core.info("Manual dispatch is unchanged; the full suite will run.");
              return;
            }

            const { owner, repo } = context.repo;
            const current = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId
            });
            const vilniusDay = value => {
              const parts = new Intl.DateTimeFormat("en-GB", {
                timeZone: "Europe/Vilnius",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }).formatToParts(new Date(value));
              const fields = Object.fromEntries(parts.map(part => [part.type, part.value]));
              return fields.year + "-" + fields.month + "-" + fields.day;
            };
            const day = vilniusDay(current.data.created_at);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "daily-suite.yml", event: "schedule", per_page: 100
            });
            const alreadySucceeded = data.workflow_runs.some(run =>
              run.id !== context.runId &&
              run.status === "completed" &&
              run.conclusion === "success" &&
              vilniusDay(run.created_at) === day
            );

            core.setOutput("run_suite", alreadySucceeded ? "false" : "true");
            core.info(alreadySucceeded
              ? "A scheduled daily suite already succeeded on " + day + "; skipping this retry."
              : "No successful scheduled daily suite exists on " + day + "; run the full suite.");
  analytics:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_suite == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run analytics unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Google API authentication
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Fetch aggregated GA4 and Search Console metrics
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '563539278' }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://pettraffic-ai.pages.dev/' }}
        run: python agent/analytics_report.py
      - name: Upload analytics report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pettraffic-analytics-7d
          path: reports/analytics-7d.md
          if-no-files-found: error
          retention-days: 30
      - name: Add analytics report to job summary
        if: always()
        run: |
          if [ -f reports/analytics-7d.md ]; then
            cat reports/analytics-7d.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Analitikos ataskaita nesukurta; patikrink ankstesnių žingsnių žurnalus.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive aggregate analytics history
        if: always() && hashFiles('reports/analytics-7d.md') != ''
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          git fetch origin automation-history
          git archive FETCH_HEAD reports/history | tar -x -C .
          python agent/analytics_history.py
          mkdir -p /tmp/pettraffic-history
          cp -R reports/history/analytics /tmp/pettraffic-history/
          rm -rf reports/history
          git fetch origin automation-history
          git checkout -B automation-history FETCH_HEAD
          git ls-files -z | python -c 'import sys; nul=bytes([0]); paths=sys.stdin.buffer.read().split(nul); [sys.stdout.buffer.write(p+nul) for p in paths if p and not p.startswith(b"reports/history/")]' | xargs -0 -r git rm -f --
          mkdir -p reports/history
          cp -R /tmp/pettraffic-history/analytics reports/history/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/history/analytics
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive aggregate analytics history"
            for attempt in 1 2 3 4 5; do
              if git push origin automation-history; then
                echo "Automation history archived successfully (attempt $attempt/5)."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Could not push automation-history after 5 attempts."
                exit 1
              fi
              echo "automation-history changed concurrently; rebasing before retry $((attempt + 1))/5."
              git pull --rebase origin automation-history
              sleep "$attempt"
            done
          else
            echo "No new analytics snapshot to archive."
          fi

  topic-radar:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_suite == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run topic history unit tests
        run: python -m unittest discover -s tests -p 'test_topic_history.py' -v
      - name: Collect Lithuanian pet-topic headlines
        run: python agent/topic_radar.py
      - name: Upload daily topic report
        uses: actions/upload-artifact@v7
        with:
          name: pettraffic-topic-radar
          path: reports/topic-radar.md
          if-no-files-found: error
          retention-days: 30
      - name: Add topic report to job summary
        if: always()
        run: |
          if [ -f reports/topic-radar.md ]; then
            cat reports/topic-radar.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Temų ataskaita nesukurta; patikrink ankstesnių žingsnių žurnalus.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive topic-radar aggregate history
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          git fetch origin automation-history
          git archive FETCH_HEAD reports/history | tar -x -C .
          python agent/topic_history.py
          mkdir -p /tmp/pettraffic-history
          cp -R reports/history/topic-radar /tmp/pettraffic-history/
          rm -rf reports/history
          git fetch origin automation-history
          git checkout -B automation-history FETCH_HEAD
          git ls-files -z | python -c 'import sys; nul=bytes([0]); paths=sys.stdin.buffer.read().split(nul); [sys.stdout.buffer.write(p+nul) for p in paths if p and not p.startswith(b"reports/history/")]' | xargs -0 -r git rm -f --
          mkdir -p reports/history
          cp -R /tmp/pettraffic-history/topic-radar reports/history/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/history/topic-radar
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive topic-radar history"
            git pull --rebase origin automation-history
            git push origin automation-history
          else
            echo "No new topic-radar snapshot to archive."
          fi

  live-check:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_suite == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check production website
        run: python agent/check_live_site.py
      - name: Open or refresh one issue when the live check fails
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "PetTraffic: production health check failed";
            const body = [
              "The automated production-site monitor detected a problem.",
              "",
              "Review the failing run and its logs:",
              context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
              "",
              "The monitor checks published pages, internal links, sitemap.xml, robots.txt and the custom 404 response. External-source failures are warnings and do not fail the check.",
              "",
              "This issue is refreshed rather than duplicated on subsequent failing runs. It will be closed automatically after a successful recovery check."
            ].join("\n");
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info("Refreshed existing site-health issue #" + existing.number);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info("Created site-health issue #" + created.data.number);
            }
      - name: Close the site-health issue after recovery
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "PetTraffic: production health check failed";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "The production health check passed again. The issue is being closed automatically. Latest successful run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed"
              });
              core.info("Closed recovered site-health issue #" + existing.number);
            } else {
              core.info("No open site-health issue to close.");
            }
