name: Pet traffic weekly growth review

on:
  # Monday evening Lithuania time, after the scheduled Lighthouse window and daily data collection.
  schedule:
    - cron: "30 18 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pettraffic-weekly-growth-review
  cancel-in-progress: false

jobs:
  weekly-review:
    name: Build and archive weekly growth review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run weekly-review and history privacy tests
        run: |
          python -m unittest discover -s agent -p 'test_weekly_growth_review.py' -v
          python -m unittest discover -s agent -p 'test_lighthouse_history.py' -v
          python -m unittest discover -s tests -p 'test_analytics_history.py' -v
      - name: Load existing privacy-filtered history
        run: |
          git fetch origin automation-history
          git archive origin/automation-history reports/history | tar -x -C .
      - name: Generate weekly growth review
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python agent/weekly_growth_review.py
      - name: Add report to GitHub Actions summary
        run: cat reports/weekly-growth-review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload weekly review
        uses: actions/upload-artifact@v7
        with:
          name: pettraffic-weekly-growth-review
          path: |
            reports/weekly-growth-review.md
            reports/weekly-growth-review.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive durable weekly review history
        run: |
          mkdir -p /tmp/pettraffic-weekly-review
          cp -R reports/history/weekly-review /tmp/pettraffic-weekly-review/
          rm -rf reports/history
          git fetch origin automation-history
          git checkout -B automation-history origin/automation-history
          # Preserve only aggregate history; do not copy source files or visitor-level data.
          git ls-files -z | python -c 'import sys; nul=bytes([0]); paths=sys.stdin.buffer.read().split(nul); [sys.stdout.buffer.write(p+nul) for p in paths if p and not p.startswith(b"reports/history/")]' | xargs -0 -r git rm -f --
          mkdir -p reports/history
          cp -R /tmp/pettraffic-weekly-review/weekly-review reports/history/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/history/weekly-review
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive weekly growth review"
for attempt in 1 2 3 4 5; do
              if git push origin automation-history; then
                echo "Automation history archived successfully (attempt $attempt/5)."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Could not push automation-history after 5 attempts."
                exit 1
              fi
              echo "automation-history changed concurrently; rebasing before retry $((attempt + 1))/5."
              git pull --rebase origin automation-history
              sleep "$attempt"
            done
          else
            echo "No new weekly review snapshot to archive."
          fi
