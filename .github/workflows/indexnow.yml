name: IndexNow URL submission

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 45

      - name: Validate key and submit sitemap URLs to IndexNow
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          key = os.environ.get("INDEXNOW_API_KEY", "").strip()
          if not key:
              print("ERROR: INDEXNOW_API_KEY secret is missing or empty.")
              sys.exit(1)

          base = "https://pettraffic-ai.pages.dev"
          host = "pettraffic-ai.pages.dev"
          key_location = f"{base}/{key}.txt"
          sitemap_url = f"{base}/sitemap.xml"

          def fetch_public(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "PetTrafficAI-IndexNow/1.0 (+https://pettraffic-ai.pages.dev)",
                      "Accept": "text/plain, application/xml, application/rss+xml, */*",
                  },
              )
              return urllib.request.urlopen(request, timeout=20)

          try:
              with fetch_public(key_location) as response:
                  public_key = response.read().decode("utf-8-sig").strip()
                  print(f"Key file check: HTTP {response.status}; content match: {public_key == key}")
          except urllib.error.HTTPError as error:
              print(f"ERROR: Key file could not be fetched: HTTP {error.code}")
              print(f"Server: {error.headers.get('server', 'unknown')}; CF-Ray: {error.headers.get('cf-ray', 'not provided')}")
              sys.exit(1)
          except Exception as error:
              print(f"ERROR: Key file check failed ({type(error).__name__}).")
              sys.exit(1)

          if public_key != key:
              print("ERROR: The public key file content does not match INDEXNOW_API_KEY.")
              print("Check that the filename is <key>.txt and the file contains only the same key.")
              sys.exit(1)

          try:
              with fetch_public(sitemap_url) as response:
                  root = ET.fromstring(response.read())
          except Exception as error:
              print(f"ERROR: Sitemap could not be fetched or parsed ({type(error).__name__}).")
              sys.exit(1)

          urls = [
              element.text.strip()
              for element in root.iter()
              if element.tag.endswith("loc") and element.text
          ]
          if not urls:
              print("ERROR: No URLs found in sitemap.")
              sys.exit(1)

          invalid_urls = [url for url in urls if urlparse(url).netloc.lower() != host]
          if invalid_urls:
              print(f"ERROR: Sitemap contains {len(invalid_urls)} URL(s) outside {host}.")
              sys.exit(1)

          submitted_urls = urls[:10000]
          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": key_location,
              "urlList": submitted_urls,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow response: HTTP {response.status}")
                  print(f"Submitted {len(submitted_urls)} sitemap URL(s).")
          except urllib.error.HTTPError as error:
              print(f"ERROR: IndexNow rejected the request: HTTP {error.code}.")
              print(error.read().decode("utf-8", "replace")[:1000])
              raise
          PY
