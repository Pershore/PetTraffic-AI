name: Pet traffic secure workflow dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.issue.number == 145 && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate owner-only workflow command
        id: guard
        run: python agent/dispatch_guard.py
      - name: Dispatch one bounded Pet traffic workflow
        if: steps.guard.outputs.authorized == 'true'
        uses: actions/github-script@v9
        env:
          DISPATCH_ACTION: ${{ steps.guard.outputs.action }}
          CONTROL_API_URL: ${{ vars.PETTRAFFIC_CONTROL_API_URL || 'https://pettraffic-control-api.pauliusgrubliauskis.workers.dev' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const action = process.env.DISPATCH_ACTION;
            const now = Date.now();

            if (action === "daily-suite") {
              const workflow_id = "daily-suite.yml";
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });

              // Match the current UTC day's 06:10 schedule, not yesterday's
              // delayed schedule run. Keep this UTC time aligned with daily-suite.yml.
              const utcDayStart = new Date();
              utcDayStart.setUTCHours(0, 0, 0, 0);
              const dailySuiteScheduleAt = new Date(utcDayStart);
              dailySuiteScheduleAt.setUTCHours(6, 10, 0, 0);
              const scheduleGraceEndsAt = dailySuiteScheduleAt.getTime() + 60 * 60 * 1000;
              if (now < scheduleGraceEndsAt) {
                core.notice("Daily-suite fallback is not eligible until the 60-minute schedule grace has passed.");
                return;
              }
              const activeOrSuccessful = run =>
                run.status !== "completed" || run.conclusion === "success";
              const vilniusDay = value => {
                const parts = new Intl.DateTimeFormat("en-GB", {
                  timeZone: "Europe/Vilnius",
                  year: "numeric",
                  month: "2-digit",
                  day: "2-digit"
                }).formatToParts(new Date(value));
                const fields = Object.fromEntries(parts.map(part => [part.type, part.value]));
                return fields.year + "-" + fields.month + "-" + fields.day;
              };
              const currentDaySchedule = data.workflow_runs.find(run =>
                run.event === "schedule" &&
                Date.parse(run.created_at) >= dailySuiteScheduleAt.getTime() &&
                activeOrSuccessful(run)
              );
              if (currentDaySchedule) {
                core.notice("Daily suite already started from today's schedule: #" +
                  currentDaySchedule.run_number + " " + currentDaySchedule.html_url);
                return;
              }

              // A plain workflow_dispatch is not valid AI evidence and must not
              // suppress the separately authorized owner-bridge fallback.
              // Only an active/successful dispatch with a complete, independently
              // verified owner-bridge marker counts as a duplicate.
              const bridgeCandidates = data.workflow_runs.filter(run =>
                run.event === "workflow_dispatch" &&
                Date.parse(run.created_at) >= dailySuiteScheduleAt.getTime() &&
                activeOrSuccessful(run) &&
                /^Owner-approved fallback \| bridge=(\d+) \| comment=(\d+)$/.test(String(run.display_title || ""))
              );
              for (const run of bridgeCandidates) {
                const marker = /^Owner-approved fallback \| bridge=(\d+) \| comment=(\d+)$/.exec(String(run.display_title || ""));
                const bridgeRunId = Number(marker[1]);
                const commentId = Number(marker[2]);
                if (!Number.isSafeInteger(bridgeRunId) || !Number.isSafeInteger(commentId)) continue;
                try {
                  const [bridgeResponse, commentResponse] = await Promise.all([
                    github.rest.actions.getWorkflowRun({ owner, repo, run_id: bridgeRunId }),
                    github.rest.issues.getComment({ owner, repo, comment_id: commentId })
                  ]);
                  const bridge = bridgeResponse.data;
                  const comment = commentResponse.data;
                  const issueNumber = Number(String(comment.issue_url || "").match(/\/issues\/(\d+)$/)?.[1] || 0);
                  const commentAt = Date.parse(comment.created_at || "");
                  const bridgeAt = Date.parse(bridge.created_at || "");
                  const runAt = Date.parse(run.created_at || "");
                  const validBridge = bridge.workflow_id === 418997808 &&
                    bridge.event === "issue_comment" && bridge.head_branch === "main" &&
                    bridge.status === "completed" && bridge.conclusion === "success" &&
                    bridge.actor?.login === "Pershore";
                  const validComment = issueNumber === 145 &&
                    String(comment.body || "").trim() === "/pettraffic-run-daily-suite" &&
                    comment.user?.login === "Pershore";
                  const sameVilniusDay = vilniusDay(comment.created_at) ===
                    vilniusDay(bridge.created_at) && vilniusDay(bridge.created_at) === vilniusDay(run.created_at);
                  const validSequence = Number.isFinite(commentAt) && Number.isFinite(bridgeAt) &&
                    Number.isFinite(runAt) && bridgeAt >= commentAt &&
                    bridgeAt - commentAt <= 10 * 60 * 1000 && runAt >= bridgeAt &&
                    runAt - bridgeAt <= 10 * 60 * 1000;
                  if (validBridge && validComment && sameVilniusDay && validSequence) {
                    core.notice("Verified owner-bridge daily suite already started: #" +
                      run.run_number + " " + run.html_url);
                    return;
                  }
                } catch (error) {
                  core.warning("Could not verify a prior owner-bridge candidate #" +
                    run.run_number + "; it will not suppress this authorized fallback. " + error.message);
                }
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main",
                inputs: {
                  fallback_mode: "owner_bridge",
                  bridge_run_id: String(context.runId),
                  bridge_comment_id: String(context.payload.comment.id)
                }
              });
              core.notice("This manual fallback is not schedule provenance. It is an owner-bridge fallback; " +
                "the Worker accepts it only after sync-control-api independently verifies this exact owner comment and bridge run.");
              return;
            }

            if (action === "sync-latest") {
              const daily = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "daily-suite.yml", branch: "main", per_page: 100
              });
              const cutoff = now - 20 * 60 * 60 * 1000;
              const source = daily.data.workflow_runs.find(run =>
                run.event === "workflow_dispatch" &&
                run.conclusion === "success" &&
                Date.parse(run.created_at) >= cutoff
              );
              if (!source) {
                core.setFailed("No successful daily-suite run found within the 20-hour safety window.");
                return;
              }
              const syncRuns = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "sync-control-api.yml", branch: "main", per_page: 100
              });
              const displayTitle = "Sync daily-suite snapshot #" + source.id;
              const already = syncRuns.data.workflow_runs.find(run =>
                run.event === "workflow_dispatch" && run.display_title === displayTitle &&
                (run.status !== "completed" || run.conclusion === "success")
              );
              if (already) {
                core.notice("This daily-suite snapshot already has a sync run: " + already.html_url);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "sync-control-api.yml",
                ref: "main",
                inputs: { source_run_id: String(source.id) }
              });
              core.notice("Dispatched D1 snapshot sync for daily-suite run #" + source.id + ".");
              return;
            }

            if (action === "control-center") {
              const workflow_id = "control-center.yml";
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });
              const cutoff = now - 60 * 60 * 1000;
              const recent = data.workflow_runs.find(run =>
                Date.parse(run.created_at) >= cutoff &&
                ["workflow_run", "workflow_dispatch", "schedule"].includes(run.event) &&
                (run.status !== "completed" || run.conclusion === "success")
              );
              if (recent) {
                core.notice("Control Center already started within 60 minutes: #" +
                  recent.run_number + " (" + recent.event + ") " + recent.html_url);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main"
              });
              core.notice("Authorized Control Center workflow_dispatch sent to main.");
              return;
            }

            if (action === "lighthouse") {
              const workflow_id = "lighthouse-audit.yml";
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });
              const cutoff = now - 24 * 60 * 60 * 1000;
              const recent = data.workflow_runs.find(run =>
                Date.parse(run.created_at) >= cutoff &&
                (run.status !== "completed" || run.conclusion === "success")
              );
              if (recent) {
                core.notice("Lighthouse audit already started within 24 hours: #" +
                  recent.run_number + " " + recent.html_url);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main"
              });
              core.notice("Authorized Lighthouse audit workflow_dispatch sent to main.");
              return;
            }

            if (action === "site-check") {
              const workflow_id = "site-check.yml";
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });
              const cutoff = now - 10 * 60 * 1000;
              const recent = data.workflow_runs.find(run =>
                Date.parse(run.created_at) >= cutoff &&
                (run.status !== "completed" || run.conclusion === "success")
              );
              if (recent) {
                core.notice("Site check already started within 10 minutes: " + recent.html_url);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: "main" });
              core.notice("Authorized site-check workflow_dispatch sent to main.");
              return;
            }

            if (action === "connectivity") {
              const workflow_id = "analytics-connectivity.yml";
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });
              const cutoff = now - 6 * 60 * 60 * 1000;
              const recent = data.workflow_runs.find(run =>
                Date.parse(run.created_at) >= cutoff &&
                (run.status !== "completed" || run.conclusion === "success")
              );
              if (recent) {
                core.notice("Google API connectivity check already started within 6 hours: " + recent.html_url);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: "main" });
              core.notice("Authorized Google API connectivity workflow_dispatch sent to main.");
              return;
            }

            if (action === "worker-diagnostics") {
              const workflow_id = "worker-cron-diagnostic.yml";
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });
              const cutoff = now - 12 * 60 * 60 * 1000;
              const recent = data.workflow_runs.find(run =>
                Date.parse(run.created_at) >= cutoff &&
                (run.status !== "completed" || run.conclusion === "success")
              );
              if (recent) {
                core.notice("Worker cron diagnostics already started within 12 hours: " + recent.html_url);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: "main" });
              core.notice("Authorized Worker cron diagnostics workflow_dispatch sent to main.");
              return;
            }

            if (action === "agent-diagnostics") {
              const workflow_id = "worker-agent-diagnostics.yml";
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 100
              });
              const cutoff = now - 30 * 60 * 1000;
              const recent = data.workflow_runs.find(run =>
                run.event === "workflow_dispatch" &&
                Date.parse(run.created_at) >= cutoff &&
                (run.status !== "completed" || run.conclusion === "success")
              );
              if (recent) {
                core.notice("Worker agent diagnostics already started within 30 minutes: " +
                  recent.html_url);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: "main"
              });
              core.notice("Authorized read-only Worker agent diagnostics workflow_dispatch sent to main.");
              return;
            }

            if (action === "task-check-site") {
              const token = await core.getIDToken("pettraffic-control-api");
              const apiUrl = (process.env.CONTROL_API_URL || "").replace(/\/$/, "");
              const response = await fetch(apiUrl + "/v1/tasks", {
                method: "POST",
                headers: {
                  authorization: "Bearer " + token,
                  "content-type": "application/json",
                },
                body: JSON.stringify({
                  type: "check_site",
                  agent: "technical-seo",
                  priority: 3,
                  payload: { target: "public_site" },
                }),
              });
              const result = await response.json().catch(() => ({}));
              if (!response.ok || result.accepted !== true) {
                core.setFailed("Could not enqueue the bounded site-check task (HTTP " + response.status + "). Check Worker deployment and OIDC authorization.");
                return;
              }
              if (result.status === "queued") {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: "run-readonly-tasks.yml", ref: "main"
                });
                core.notice("Read-only site-check task " + result.task_id +
                  " queued; dispatched the dedicated cloud runner.");
              } else if (result.status === "running") {
                core.notice("Read-only site-check task " + result.task_id +
                  " is already running; no duplicate runner dispatched.");
              } else {
                core.setFailed("Task API returned an unexpected task state: " + result.status);
              }
              return;
            }
            core.setFailed("Guard returned an unknown dispatch action.");
