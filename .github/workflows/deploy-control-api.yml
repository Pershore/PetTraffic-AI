name: Deploy PetTraffic control API

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-control-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm test
      - run: python -m unittest discover -s test -p '*_test.py' -v

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.PETTRAFFIC_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable" && exit 1)
          test -n "$D1_DATABASE_ID" || (echo "Missing PETTRAFFIC_D1_DATABASE_ID repository variable" && exit 1)
      - name: Apply D1 migrations and deploy Worker
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("wrangler.toml")
          text = path.read_text()
          text = text.replace("REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID", os.environ["CLOUDFLARE_ACCOUNT_ID"])
          text = text.replace("REPLACE_WITH_D1_DATABASE_ID", os.environ["D1_DATABASE_ID"])
          path.write_text(text)
          PY
          npx --yes wrangler@4 d1 migrations apply pettraffic-control --remote
          npx --yes wrangler@4 deploy
