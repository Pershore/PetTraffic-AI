name: Pet traffic central control center

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "agent/control_center.py"
      - "agent/history_store.py"
      - "agent/recommendations.py"
      - "agent/analytics_history.py"
      - "agent/topic_history.py"
      - "tests/test_control_center.py"
      - "tests/test_history_store.py"
      - "tests/test_analytics_history.py"
      - "tests/test_topic_history.py"
      - "tests/test_recommendations.py"
      - ".github/workflows/control-center.yml"

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: pettraffic-control-center
  cancel-in-progress: true

jobs:
  control-center:
    name: Read-only automation health and priorities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run control-center unit tests
        run: |
          python -m unittest discover -s tests -p 'test_control_center.py' -v
          python -m unittest discover -s tests -p 'test_history_store.py' -v
          python -m unittest discover -s tests -p 'test_analytics_history.py' -v
          python -m unittest discover -s tests -p 'test_topic_history.py' -v
          python -m unittest discover -s tests -p 'test_recommendations.py' -v
      - name: Build central status report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python agent/control_center.py
        continue-on-error: ${{ github.event_name == 'pull_request' }}
      - name: Load history and generate recommendations
        if: success() && github.event_name != 'pull_request'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          git fetch origin automation-history
          git archive origin/automation-history reports/history | tar -x -C .
          python agent/history_store.py
          python agent/recommendations.py
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f reports/control-center.md ]; then
            cat reports/control-center.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Centrinio valdymo ataskaita nesukurta." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/recommendations.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat reports/recommendations.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify on actionable automation problems
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "reports/control-center.json";
            if (!fs.existsSync(path)) {
              core.warning("Control-center JSON is missing; cannot update the alert issue.");
              return;
            }
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            const title = "PetTraffic: central automation alert";
            const { owner, repo } = context.repo;
            const runUrl = context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId;
            const problems = (data.results || []).filter(item =>
              ["failure", "api_error", "stale", "warning", "unknown"].includes(item.state)
            );
            const lines = [
              "The central control center detected an automation problem that may need attention.",
              "",
              "Latest control-center run: " + runUrl,
              "",
              "## Findings",
              ...problems.map(item => "- **" + item.name + "** — " + item.state + ": " + item.detail + (item.url ? " (" + item.url + ")" : "")),
              "",
              "This issue is updated on subsequent checks and closed automatically after recovery."
            ];
            const body = lines.join("\n");
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === title && !issue.pull_request);
            if (data.needs_attention) {
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                core.info("Updated central alert issue #" + existing.number);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title, body });
                core.info("Created central alert issue #" + created.data.number);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "The central control center reports recovery. Latest successful check: " + runUrl
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed"
              });
              core.info("Closed recovered central alert issue #" + existing.number);
            } else {
              core.info("No actionable issue; no alert needed.");
            }
      - name: Upload central status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pettraffic-control-center
          path: |
            reports/control-center.*
            reports/recommendations.*
          if-no-files-found: error
          retention-days: 90

      - name: Archive durable control-center history
        if: success() && github.event_name != 'pull_request'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p /tmp/pettraffic-history
          cp -R reports/history/control-center /tmp/pettraffic-history/
          cp -R reports/history/recommendations /tmp/pettraffic-history/
          rm -rf reports/history
          git fetch origin automation-history
          git checkout -B automation-history origin/automation-history
          mkdir -p reports/history
          cp -R /tmp/pettraffic-history/control-center reports/history/
          cp -R /tmp/pettraffic-history/recommendations reports/history/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/history/control-center reports/history/recommendations
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive control-center history"
            git pull --rebase origin automation-history
            git push origin automation-history
          else
            echo "No new history snapshot to archive."
          fi
