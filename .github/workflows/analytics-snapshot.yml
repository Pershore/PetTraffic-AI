name: PetTraffic AI analytics snapshot

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Google API authentication
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Fetch aggregated GA4 and Search Console metrics
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '563539278' }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://pettraffic-ai.pages.dev/' }}
        run: python agent/analytics_report.py
      - name: Upload analytics report
        uses: actions/upload-artifact@v4
        with:
          name: pettraffic-analytics-7d
          path: reports/analytics-7d.md
          if-no-files-found: error
          retention-days: 30
