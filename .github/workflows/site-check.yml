name: Pet traffic site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "content/**"]

permissions:
  contents: read

# Keep only the newest validation run for each branch/PR ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    name: Validate static website and automation code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate HTML, links, SEO and sitemap
        run: python agent/validate_site.py
      - name: Compile automation scripts
        run: python -m compileall -q agent
      - name: Test topic radar parsing and error handling
        run: python -m unittest discover -s agent -p 'test_*.py' -v
