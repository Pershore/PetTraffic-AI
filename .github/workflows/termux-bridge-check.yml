name: Termux Codex bridge checks

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/termux/**"
      - "docs/TERMUX_CODEX_BRIDGE.md"
      - "docs/SESSION_START.md"
      - ".github/workflows/termux-bridge-check.yml"
  push:
    branches: [main]
    paths:
      - "tools/termux/**"
      - "docs/TERMUX_CODEX_BRIDGE.md"
      - "docs/SESSION_START.md"
      - ".github/workflows/termux-bridge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax
        run: |
          bash -n tools/termux/bootstrap.sh
          bash -n tools/termux/setup-debian.sh
          bash -n tools/termux/ensure-npm.sh
          bash -n tools/termux/test-bootstrap.sh
          bash -n tools/termux/test-ensure-npm.sh
          bash -n tools/termux/test-setup-debian-stdin.sh
          bash tools/termux/test-bootstrap.sh
          bash tools/termux/test-ensure-npm.sh
          bash tools/termux/test-setup-debian-stdin.sh
      - name: Check safe setup invariants
        run: |
          grep -Fq 'codex login --device-auth' tools/termux/setup-debian.sh
          grep -Fq 'Device code login' tools/termux/setup-debian.sh
          grep -Fq 'ensure-npm.sh' tools/termux/setup-debian.sh
          ! grep -Fq 'BASH_SOURCE' tools/termux/setup-debian.sh
          grep -Fq 'apt-get install --reinstall -y nodejs npm node-glob' tools/termux/ensure-npm.sh
          grep -Fq 'Device code login' docs/TERMUX_CODEX_BRIDGE.md
          grep -Fq 'gh auth setup-git' tools/termux/setup-debian.sh
          grep -Fq 'proot-distro login "$DISTRO"' tools/termux/bootstrap.sh
          ! grep -Eiq '(OPENAI_API_KEY|CLOUDFLARE_API_TOKEN|CLOUDFLARE_GLOBAL_API_KEY)=' tools/termux/*.sh
