name: Pet traffic Worker cron diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker-cron-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: pettraffic-worker-cron-diagnostics
  cancel-in-progress: false

jobs:
  verify-and-observe:
    name: Verify configured crons and observe live invocations
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify Cloudflare schedules
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          if not token or not account:
              raise SystemExit("Required Cloudflare connection settings are missing.")

          def get_cloudflare(url):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read())

          schedules = get_cloudflare(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/pettraffic-control-api/schedules"
          )
          if not schedules.get("success"):
              raise SystemExit("Cloudflare did not confirm Worker schedules.")
          actual = sorted({item.get("cron") for item in schedules.get("result", {}).get("schedules", []) if item.get("cron")})
          expected = {"*/15 * * * *", "20 7,8 * * *"}
          missing = sorted(expected - set(actual))
          print("Registered Worker schedules: " + ", ".join(actual))
          if missing:
              raise SystemExit("Expected schedules missing: " + ", ".join(missing))

          # The public Worker /health endpoint is verified independently by the browser.
          # This credentialed runner only calls Cloudflare's API and Wrangler.
          PY

      - name: Observe Worker invocations for one cron interval
        working-directory: worker
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wrangler-tail.toml" <<EOF
          name = "pettraffic-control-api"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          compatibility_date = "2026-11-12"
          [observability]
          enabled = true
          EOF

          set +e
          timeout --signal=INT --kill-after=30s 17m npx --yes wrangler@4 tail pettraffic-control-api --config "$RUNNER_TEMP/wrangler-tail.toml" --format=json --sampling-rate=0.99 > "$RUNNER_TEMP/worker-tail.jsonl" 2> "$RUNNER_TEMP/worker-tail.stderr"
          tail_status=$?
          set -e
          if [ "$tail_status" -ne 124 ] && [ "$tail_status" -ne 130 ]; then
            cat "$RUNNER_TEMP/worker-tail.stderr"
            exit "$tail_status"
          fi

          python ../tools/worker-tail/parse_logs.py "$RUNNER_TEMP/worker-tail.jsonl"
