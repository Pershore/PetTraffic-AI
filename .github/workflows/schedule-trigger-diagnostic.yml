name: Temporary schedule trigger diagnostic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm GitHub scheduled event delivery
        run: |
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "scheduled_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test "${GITHUB_EVENT_NAME}" = "schedule"
